<!DOCTYPE html>
<html>

<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div style="padding:20px; font-family:Arial;">

  <h2>Admin Dashboard</h2>

  <!-- STATS -->
  <h3>📊 Dashboard Stats</h3>

  <div style="display:flex; flex-wrap:wrap; gap:15px;">

    <div style="background:#e3f2fd; padding:15px; border-radius:10px;">
      👩‍🎓 Students: {{ total_students }}
    </div>

    <div style="background:#e8f5e9; padding:15px; border-radius:10px;">
      👨‍🏫 Instructors: {{ total_instructors }}
    </div>

    <div style="background:#fff3e0; padding:15px; border-radius:10px;">
      ❓ Questions: {{ total_questions }}
    </div>

    <div style="background:#fce4ec; padding:15px; border-radius:10px;">
      📝 Attempts: {{ total_attempts }}
    </div>

    <div style="background:#ede7f6; padding:15px; border-radius:10px;">
      📈 Avg Score: {{ avg_score }}%
    </div>

  </div>

  <hr>

  <!-- ACTIONS -->
  <h3>⚙️ Actions</h3>

  <button onclick="location.href='/add_instructor'">Add Instructor</button>
  <button onclick="location.href='/add_question'">Add Question</button>
  <button onclick="location.href='/export_results'">Download Results</button>
  <button onclick="location.href='/logout'">Logout</button>

  <hr>

  <!-- NAVIGATION -->
  <h3>📂 Manage Sections</h3>

  <div style="display:flex; gap:20px; flex-wrap:wrap;">

    <button onclick="location.href='/admin/users'">👥 Users</button>

    <button onclick="location.href='/admin/questions'">❓ Questions</button>

    <button onclick="location.href='/admin/results'">📊 Results</button>

    <button onclick="location.href='/admin/attempts'">🧪 Student Attempts</button>

  </div>

</div>

</body>
</html>
